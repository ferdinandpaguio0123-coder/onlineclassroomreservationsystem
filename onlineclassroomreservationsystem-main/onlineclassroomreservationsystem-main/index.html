<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassReserve | Classroom Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>ClassReserve</h1>
            <p>Online Classroom Reservation System</p>
        </div>
    </header>
    <main class="container">
        <!-- LOGIN -->
        <section id="login-section" class="card">
            <h2>Login to ClassReserve</h2>
            <p>Enter your username and password to continue.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <p id="login-error" role="alert" hidden>
                    Incorrect username or password.
                </p>
                <button type="submit">Log In</button>
            </form>
        </section>
        <!-- DASHBOARD -->
        <section id="dashboard-section" class="card" hidden>
            <div class="dashboard-header">
                <div>
                    <h2 id="dashboard-title">Dashboard</h2>
                    <p id="welcome-message"></p>
                </div>
                <button type="button" id="logout-button">
                    Log Out
                </button>
            </div>
            <nav class="navigation" aria-label="Dashboard navigation">
                <button type="button" data-view="dashboard">
                    Dashboard
                </button>
                <button type="button" data-view="rooms">
                    Classrooms
                </button>
                <button type="button" data-view="reservations">
                    Reservations
                </button>
            </nav>
            <div id="dashboard-content"></div>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2026 ClassReserve | Online Classroom Reservation System</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
